<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>RobloMarket - Скупка предметов Roblox</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body.dark {
            --bg: #0a0a0a;
            --card-bg: #1a1a1a;
            --header-bg: #0f0f0f;
            --tab-bar: #0f0f0f;
            --input-bg: #252525;
            --text-primary: #ffffff;
            --text-secondary: #aaaaaa;
            --success: #2e7d32;
            --error: #d32f2f;
            --warning: #ff9800;
            --primary: #4caf50;
            --primary-dark: #388e3c;
            --border: #2a2a2a;
            --shadow: 0 4px 15px rgba(0,0,0,0.3);
            --gradient-start: #4caf50;
            --gradient-end: #2e7d32;
        }

        body.light {
            --bg: #f5f7fa;
            --card-bg: #ffffff;
            --header-bg: #ffffff;
            --tab-bar: #ffffff;
            --input-bg: #f0f2f5;
            --text-primary: #1a1a2e;
            --text-secondary: #666666;
            --success: #2e7d32;
            --error: #d32f2f;
            --warning: #ff9800;
            --primary: #4caf50;
            --primary-dark: #388e3c;
            --border: #e0e0e0;
            --shadow: 0 4px 15px rgba(0,0,0,0.08);
            --gradient-start: #4caf50;
            --gradient-end: #2e7d32;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .app {
            max-width: 600px;
            margin: 0 auto;
            min-height: 100vh;
            background: var(--bg);
            padding-bottom: 95px; /* Увеличено, чтобы плашка не перекрывала нижний контент */
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            background: var(--header-bg);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow);
        }
        
        .logo-icon img {
            width: 24px;
            height: 24px;
            filter: brightness(0) invert(1);
        }
        
        .header h1 {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        .header-right {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        
        .theme-toggle {
            background: var(--input-bg);
            border: none;
            font-size: 18px;
            cursor: pointer;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            box-shadow: var(--shadow);
        }
        
        .chat-icon-btn {
            background: var(--input-bg);
            border: none;
            font-size: 18px;
            cursor: pointer;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: all 0.2s ease;
            box-shadow: var(--shadow);
        }
        
        .unread-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--error);
            color: white;
            font-size: 10px;
            font-weight: bold;
            min-width: 18px;
            height: 18px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
        }
        
        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            color: white;
            transition: all 0.2s ease;
            box-shadow: var(--shadow);
            overflow: hidden;
        }
        
        .user-menu {
            position: absolute;
            top: 65px;
            right: 16px;
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border);
            overflow: hidden;
            z-index: 200;
            min-width: 190px;
            box-shadow: var(--shadow);
        }
        
        .user-menu button {
            width: 100%;
            padding: 14px 18px;
            background: none;
            border: none;
            color: var(--text-primary);
            text-align: left;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        
        .user-menu button:hover {
            background: var(--input-bg);
        }
        
        .tab-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-width: 600px;
            margin: 0 auto;
            background: rgba(15, 15, 15, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 8px 12px 14px;
            z-index: 100;
            overflow-x: auto;
        }
        
        .tab-btn {
            background: none;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 10px;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 30px;
            transition: all 0.25s ease;
            white-space: nowrap;
        }
        
        .tab-btn.active {
            color: var(--primary);
            background: rgba(76, 175, 80, 0.15);
            transform: translateY(-2px);
        }
        
        .tab-icon {
            font-size: 22px;
        }
        
        .content {
            padding: 16px;
        }
        
        .mode-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 16px;
        }
        
        .mode-tab {
            padding: 8px 16px;
            background: var(--input-bg);
            border: none;
            border-radius: 30px;
            color: var(--text-secondary);
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 13px;
        }
        
        .mode-tab.active {
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            color: white;
            box-shadow: var(--shadow);
        }
        
        .search-input {
            width: 100%;
            padding: 12px 16px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 30px;
            color: var(--text-primary);
            font-size: 15px;
            margin-bottom: 16px;
        }
        
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
        
        .product-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 12px;
            text-align: center;
            transition: all 0.2s ease;
            border: 2px solid transparent;
            position: relative;
            box-shadow: var(--shadow);
        }
        
        .product-card.selectable {
            cursor: pointer;
        }
        
        .product-card.selectable.selected {
            border-color: var(--success);
            transform: scale(1.02);
        }
        
        .product-image {
            width: 70px;
            height: 70px;
            margin: 0 auto 10px;
            border-radius: 12px;
            overflow: hidden;
            background: var(--input-bg);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        .product-name {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 4px;
            line-height: 1.3;
        }
        
        .product-quantity {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 4px;
        }
        
        .check-mark {
            position: absolute;
            top: 6px;
            right: 6px;
            width: 22px;
            height: 22px;
            background: var(--success);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: white;
        }
        
        .tab-bar button {
            user-select: none;
        }

        /* ИСПРАВЛЕНО: Плашка теперь всегда закреплена на экране */
        .floating-bar {
            position: fixed;
            bottom: 75px; /* Находится ровно над таб-баром */
            left: 50%;
            transform: translateX(-50%);
            max-width: 90%;
            width: auto;
            min-width: 300px;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            border-radius: 50px;
            padding: 14px 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            z-index: 105; /* Больше, чем у header и tab-bar */
            box-shadow: 0 6px 25px rgba(76, 175, 80, 0.5);
        }
        
        .floating-info {
            font-weight: bold;
            font-size: 15px;
            color: white;
        }
        
        .floating-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            padding: 8px 24px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }
        
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        
        .modal-content {
            background: var(--card-bg);
            border-radius: 28px;
            padding: 24px;
            max-width: 400px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: var(--shadow);
        }
        
        .btn {
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 14px;
        }
        
        .btn-success {
            background: linear-gradient(135deg, #2e7d32, #1b5e20);
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #d32f2f, #b71c1c);
        }
        
        .stats-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 12px;
            margin: 20px 0;
        }
        
        .stat-card {
            flex: 1;
            min-width: 100px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 16px 12px;
            text-align: center;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }
        
        .stat-value {
            font-size: 18px;
            font-weight: bold;
            color: var(--success);
            margin-bottom: 6px;
        }
        
        .stat-label {
            font-size: 10px;
            color: var(--text-secondary);
            line-height: 1.3;
        }
        
        .exchange-rate {
            background: var(--input-bg);
            border-radius: 30px;
            padding: 10px 16px;
            font-size: 13px;
            color: var(--text-secondary);
            text-align: center;
            margin-bottom: 16px;
            cursor: pointer;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }
        
        .page-title {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        .page-subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 24px;
        }
        
        .balance-card {
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 20px;
            text-align: center;
            color: white;
        }
        
        .balance-amount {
            font-size: 42px;
            font-weight: bold;
            margin: 10px 0;
        }
        
        .history-item {
            padding: 12px;
            border-bottom: 1px solid var(--border);
        }
        
        .history-date {
            font-size: 10px;
            color: var(--text-secondary);
        }
        
        .frozen-card {
            background: var(--input-bg);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 16px;
            border-left: 4px solid var(--warning);
        }
        
        .chat-container {
            display: flex;
            flex-direction: column;
            height: 70vh;
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 20px;
            font-size: 14px;
        }
        
        .message-out {
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        
        .message-in {
            background: var(--input-bg);
            color: var(--text-primary);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        
        .message-time {
            font-size: 9px;
            margin-top: 4px;
            opacity: 0.7;
        }
        
        .chat-input-area {
            display: flex;
            gap: 8px;
            padding: 12px;
            background: var(--card-bg);
            border-top: 1px solid var(--border);
        }
        
        .chat-input {
            flex: 1;
            padding: 12px 18px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 30px;
            color: var(--text-primary);
            font-size: 14px;
        }
        
        .chat-send-btn {
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            border: none;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            color: white;
        }
        
        .chat-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: var(--card-bg);
            border-radius: 20px;
            margin-bottom: 8px;
            cursor: pointer;
            border: 1px solid var(--border);
        }
        
        .chat-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
        }
        
        .chat-info {
            flex: 1;
        }
        
        .chat-name {
            font-weight: bold;
            font-size: 14px;
        }
        
        .chat-last-message {
            font-size: 11px;
            color: var(--text-secondary);
        }
        
        .quantity-control {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
        }
        
        .quantity-btn {
            background: var(--input-bg);
            border: 1px solid var(--border);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-primary);
        }
        
        .scup-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            background: var(--card-bg);
            border-radius: 16px;
            margin-bottom: 8px;
            border: 1px solid var(--border);
        }
        
        .scup-info {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        .scup-badge {
            background: var(--success);
            border-radius: 20px;
            padding: 4px 8px;
            font-size: 10px;
            color: white;
        }
        
        .scup-badge-verified {
            background: linear-gradient(135deg, #ff9800, #ff5722);
            border-radius: 20px;
            padding: 4px 8px;
            font-size: 10px;
            color: white;
        }
        
        .stats-cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin: 20px 0;
        }
        
        .stat-card-big {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 16px;
            text-align: center;
            border: 1px solid var(--border);
        }
        
        .stat-value-big {
            font-size: 28px;
            font-weight: bold;
            color: var(--success);
        }
        
        .stat-label-big {
            font-size: 12px;
            color: var(--text-secondary);
        }
        
        .chart-container {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 16px;
            margin: 16px 0;
            border: 1px solid var(--border);
        }
        
        .cookie-display {
            background: var(--input-bg);
            border-radius: 12px;
            padding: 8px;
            margin-top: 8px;
            font-size: 10px;
            color: var(--text-secondary);
            word-break: break-all;
        }
        
        .purchase-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
            position: relative;
        }
        
        .copy-btn {
            background: var(--input-bg);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            cursor: pointer;
            margin-top: 8px;
            color: var(--text-primary);
        }
        
        .hidden {
            display: none !important;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }
        
        .withdraw-request {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
        }
        
        .withdraw-request-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        
        .status-pending {
            color: var(--warning);
        }
        
        .status-completed {
            color: var(--success);
        }
        
        .price-edit-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            border-bottom: 1px solid var(--border);
        }
        
        .price-edit-row input {
            width: 80px;
            padding: 6px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
        }
        
        .price-edit-row button {
            width: auto;
            padding: 6px 12px;
            margin-left: 8px;
        }
        
        .lot-items-list {
            margin: 8px 0;
            padding-left: 14px;
            text-align: left;
            font-size: 13px;
        }
    </style>
</head>
<body class="dark">
    <div class="app">
        <div class="header">
            <div class="logo">
                <div class="logo-icon">
                    <img src="https://cdn-icons-png.flaticon.com/512/5969/5969320.png" alt="Roblox">
                </div>
                <h1>RobloMarket</h1>
            </div>
            <div class="header-right">
                <button class="theme-toggle" id="themeToggle">🌙</button>
                <button class="chat-icon-btn" id="chatBtn">
                    <span class="chat-icon">💬</span>
                    <span class="unread-badge hidden" id="unreadBadge">0</span>
                </button>
                <div class="avatar" id="avatarBtn">👤</div>
            </div>
        </div>
        
        <div class="user-menu hidden" id="userMenu">
            <button id="profileBtn">👤 ПРОФИЛЬ</button>
            <button id="financesBtn">💰 ФИНАНСЫ</button>
            <button id="supportBtn">🆘 ТЕХПОДДЕРЖКА</button>
            <button id="logoutBtn">🚪 ВЫЙТИ</button>
        </div>
        
        <div class="content" id="content">
            <div class="loading">Загрузка...</div>
        </div>
        
        <div class="tab-bar" id="tabBar"></div>
        
        <div class="floating-bar hidden" id="floatingBar">
            <span class="floating-info" id="floatingInfo">Выбрано: 0 товаров</span>
            <button class="floating-btn" id="floatingBtn">ПРОДОЛЖИТЬ</button>
        </div>
    </div>

    <script>
        // ==================== FIREBASE CONFIG ====================
        const firebaseConfig = {
            apiKey: "AIzaSyBUmYcoaSQw7Z4uPJIrruoFDdJpJIToOnys",
            authDomain: "roblomaret.firebaseapp.com",
            projectId: "roblomaret",
            storageBucket: "roblomaret.firebasestorage.app",
            messagingSenderId: "109211980148",
            appId: "1:109211980148:web:3b515d53de8ac706535c21"
        };
        
        let db;
        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
            console.log("✅ Firebase подключен");
        } catch (e) {
            console.error("❌ Ошибка Firebase:", e);
        }
        
        function initTheme() {

        async function createCryptoBotInvoice(amount, description) {

                const response = await fetch('https://roblomarket-backend32.onrender.com/api/create-invoice', {

                    body: JSON.stringify({ amount: amount, userId: currentUser ? currentUser.id.toString() : null })

                    const errText = await response.text();
                    console.error("Сервер вернул ошибку:", response.status, errText);
                    if (tg) tg.showAlert(`❌ Ошибка сервера Render (${response.status}): ${errText.substring(0, 50)}`);
                    return null;
                }
                const data = await response.json();
                if (data.ok && data.payLink) {
                    if (window.Telegram?.WebApp) {
                        if (data.payLink.includes('t.me/')) {
                            window.Telegram.WebApp.openTelegramLink(data.payLink);
                        } else {
                            window.Telegram.WebApp.openLink(data.payLink);
                        }
                    } else {
                        window.open(data.payLink, '_blank');
                    }
                    return data;
                } else {
                    if (tg) tg.showAlert(`❌ Ответ бэкенда не содержит payLink: ${JSON.stringify(data)}`);
                }
                return null;
            } catch (error) {
                console.error("Ошибка создания счета через API Render:", error);
                if (tg) tg.showAlert(`❌ Критическая ошибка fetch: ${error.message}`);

            }
        }

        async function loadMessages(chatId, container) {

                messagesSnapshot.forEach(doc => {
                    const msg = doc.data();
                    const isOut = msg.userId === currentUser.id.toString();
                    const div = document.createElement('div');
                    div.className = `message ${isOut ? 'message-out' : 'message-in'}`;
                    div.innerHTML = `<div>${escapeHtml(msg.text)}</div><div class="message-time">${new Date(msg.time).toLocaleTimeString()}</div>`;
                    container.appendChild(div);
                });
                container.scrollTop = container.scrollHeight;
            } catch (e) {
                console.error(e);
            }
        }

                let newQty = parseInt(qtySpan.innerText) + delta;
                if (newQty < 1) newQty = 1;
                if (newQty > 999) newQty = 999;

        async function buyAsScup(orderId, rubAmount, totalWithCommission, sellerIdForChat, sellerNameForChat) {
            if (!db || !currentUser) return;
            if (balance < rubAmount) {
                if (tg) tg.showAlert('❌ Недостаточно средств на балансе. Пополните в Финансах!');
                return;
            }
            if (!confirm(`Вы уверены, что хотите выкупить лот за ${rubAmount.toFixed(0)} ₽? Средства будут заморожены.`)) return;
            
            try {
                const buyerRef = db.collection('users').doc(currentUser.id.toString());
                const orderRef = db.collection('orders').doc(orderId);
                
                await db.runTransaction(async (transaction) => {
                    const bDoc = await transaction.get(buyerRef);
                    const oDoc = await transaction.get(orderRef);
                    
                    if (oDoc.data().status !== 'pending') throw "Лот уже выкуплен или изменен!";
                    
                    const currentBalance = bDoc.data().balance || 0;
                    const currentFrozen = bDoc.data().frozenBalance || 0;
                    
                    transaction.update(orderRef, { status: 'on_hold' });
                    transaction.update(buyerRef, {
                        balance: currentBalance - rubAmount,
                        frozenBalance: currentFrozen + rubAmount
                    });
                    
                    const purchaseId = `PCH_${Date.now()}`;
                    const purchaseRef = db.collection('purchases').doc(purchaseId);
                    
                    transaction.set(purchaseRef, {
                        id: purchaseId,
                        orderId: orderId,
                        items: oDoc.data().items,
                        totalUsd: totalWithCommission,
                        rubAmount: rubAmount,
                        cookie: oDoc.data().cookie,
                        sellerId: oDoc.data().sellerId,
                        seller: oDoc.data().sellerName,
                        buyerId: currentUser.id.toString(),
                        buyerName: currentUser.username,
                        status: 'on_hold',
                        date: new Date().toISOString()
                    });
                });
                
                if (tg) tg.showAlert(`🔒 Лот успешно выкуплен в удержание! Средства заморожены.`);
                if (sellerIdForChat && sellerNameForChat) {
                    await createOrGetChat(sellerIdForChat, sellerNameForChat);
                }
                await loadUserData();
                switchTab('myPurchases');
            } catch (error) {
                if (tg) tg.showAlert(`❌ Ошибка сделки: ${error}`);
                console.error(error);
            }
        }
        
        async function confirmEscrowPurchase(purchaseId) {
            if (!db) return;
            try {
                const purchaseRef = db.collection('purchases').doc(purchaseId);
                const purchaseDoc = await purchaseRef.get();
                const pData = purchaseDoc.data();
                const orderRef = db.collection('orders').doc(pData.orderId);
                const orderDoc = await orderRef.get();
                const oData = orderDoc.data();
                const buyerRef = db.collection('users').doc(pData.buyerId);
                const sellerRef = db.collection('users').doc(pData.sellerId);
                
                await db.runTransaction(async (transaction) => {
                    const bDoc = await transaction.get(buyerRef);
                    const sDoc = await transaction.get(sellerRef);
                    
                    const buyerFrozen = bDoc.data().frozenBalance || 0;
                    const sellerBalance = sDoc.data().balance || 0;
                    
                    transaction.update(buyerRef, { frozenBalance: buyerFrozen - pData.rubAmount });
                    const sellerPayoutRub = oData.payoutUsd * exchangeRate;
                    transaction.update(sellerRef, { balance: sellerBalance + sellerPayoutRub });
                    transaction.update(purchaseRef, { status: 'completed' });
                    transaction.update(orderRef, { status: 'sold' });
                });
                
                if (tg) tg.showAlert('✅ Сделка завершена! Средства переведены продавцу.');
                await addIncome(oData.commissionUsd);
                await loadUserData();
            } catch (err) {
                if (tg) tg.showAlert(`❌ Не удалось подтвердить сделку: ${err}`);
            }
        }
        
        async function cancelEscrowPurchase(purchaseId) {
            if (!db) return;
            if (!confirm('Вы действительно хотите отменить покупку лота и вернуть средства?')) return;
            try {
                const purchaseRef = db.collection('purchases').doc(purchaseId);
                await db.runTransaction(async (transaction) => {
                    const purchaseDoc = await transaction.get(purchaseRef);
                    if (!purchaseDoc.exists) throw "Покупка не найдена";
                    const pData = purchaseDoc.data();
                    const orderRef = db.collection('orders').doc(pData.orderId);
                    const buyerRef = db.collection('users').doc(pData.buyerId);
                    
                    const bDoc = await transaction.get(buyerRef);
                    const buyerFrozen = bDoc.data().frozenBalance || 0;
                    const buyerBalance = bDoc.data().balance || 0;
                    
                    transaction.update(buyerRef, {
                        frozenBalance: buyerFrozen - pData.rubAmount,
                        balance: buyerBalance + pData.rubAmount
                    });
                    transaction.update(orderRef, { status: 'pending' });
                    transaction.delete(purchaseRef);
                });
                if (tg) tg.showAlert('❌ Покупка отменена, средства возвращены на ваш баланс.');
                await loadUserData();
                switchTab('scupka');
            } catch (err) {
                if (tg) tg.showAlert(`❌ Ошибка отмены: ${err}`);
            }
        }

                    <button class="btn btn-success" style="padding:14px" onclick="showDepositModal()">➕ ПОПОЛНИТЬ</button>
                    <button class="btn" style="padding:14px; background:var(--input-bg); color:var(--text-primary); border:1px solid var(--border);" onclick="showWithdrawModal()">💸 ВЫВЕСТИ РУБЛИ</button>
                </div>
            `;
        }
        
        function showDepositModal() {
            const modal = document.createElement('div');
            modal.className = 'modal';
            modal.innerHTML = `
                <div class="modal-content">
                    <h3>➕ Пополнение баланса (USDT)</h3>
                    <p style="font-size:12px; color:var(--text-secondary); margin:8px 0 16px;">Курс зачисления: 1 USDT = ${exchangeRate} RUB. Оплата через CryptoBot.</p>
                    <input type="number" id="depAmount" class="search-input" style="margin-bottom:16px" placeholder="Сумма в USDT (мин. 1)">
                    <button class="btn btn-success" style="margin-bottom:8px" onclick="confirmDeposit()">💳 ОПЛАТИТЬ</button>
                    <button class="btn" style="background:var(--input-bg);color:var(--text-primary)" onclick="closeModal()">ОТМЕНА</button>
                </div>
            `;
            document.body.appendChild(modal);
        }
        
        function confirmDeposit() {
            const amount = parseFloat(document.getElementById('depAmount').value);
            if (!amount || amount < 1) {
                if (tg) tg.showAlert('❌ Введите корректную сумму от 1 USDT');
                return;
            }
            closeModal();
            deposit(amount);
        }
        
        function showWithdrawModal() {
            const modal = document.createElement('div');
            modal.className = 'modal';
            modal.innerHTML = `
                <div class="modal-content">
                    <h3>💸 Вывод средств (Ручной)</h3>
                    <p style="font-size:12px; color:var(--text-secondary); margin:8px 0 16px;">Введите сумму в USDT. Мы переведем рубли по курсу системы. Минималка: 10 USDT (~${10*exchangeRate} ₽).</p>
                    <input type="number" id="withAmount" class="search-input" style="margin-bottom:12px" placeholder="Сумма в USDT (мин. 10)">
                    <input type="text" id="targetTgId" class="search-input" style="margin-bottom:16px" placeholder="Ваш Telegram ID или Username">
                    <button class="btn btn-success" style="margin-bottom:8px" onclick="confirmWithdraw()">💸 ОФОРМИТЬ ВЫВОД</button>
                    <button class="btn" style="background:var(--input-bg);color:var(--text-primary)" onclick="closeModal()">ОТМЕНА</button>
                </div>
            `;
            document.body.appendChild(modal);
        }
        
        function confirmWithdraw() {
            const amount = parseFloat(document.getElementById('withAmount').value);
            const tgId = document.getElementById('targetTgId').value;
            if (!amount || amount < 10) {
                if (tg) tg.showAlert('❌ Минимальная сумма вывода 10 USDT');
                return;
            }
            if ((amount * exchangeRate) > balance) {
                if (tg) tg.showAlert('❌ Недостаточно средств на балансе');
                return;
            }
            if (!tgId) {
                if (tg) tg.showAlert('❌ Укажите Telegram ID получателя');
                return;
            }
            closeModal();
            requestWithdraw(amount, tgId);
        }
        
        function renderSupport() {
            document.getElementById('content').innerHTML = `
                <div class="page-title">ТЕХПОДДЕРЖКА</div>
                <div class="page-subtitle">Есть вопросы? Напишите нам напрямую!</div>
                <div style="background:var(--card-bg); border-radius:24px; padding:20px; border:1px solid var(--border); box-shadow:var(--shadow)">
                    <textarea id="supportText" style="width:100%; height:120px; padding:14px; background:var(--input-bg); border:1px solid var(--border); border-radius:16px; color:var(--text-primary); font-size:14px; margin-bottom:16px;" placeholder="Опишите вашу проблему или задайте вопрос подробно..."></textarea>
                    <button class="btn" onclick="sendSupportRequest()">✉️ ОТПРАВИТЬ ОБРАЩЕНИЕ</button>
                </div>
            `;
        }
        
        // ==================== PANELS ADMIN ====================
        async function renderModerka() {
            if (!isAdmin) {
                switchTab('home');
                return;
            }
            let supportTickets = [];
            let pendingWithdrawals = [];
            if (db) {
                try {
                    const supportSnapshot = await db.collection('supportTickets').where('status', '==', 'open').get();
                    supportSnapshot.forEach(doc => supportTickets.push({ id: doc.id, ...doc.data() }));
                } catch(e) { console.error(e); }
                try {
                    const withdrawSnapshot = await db.collection('withdrawals').where('status', '==', 'pending').get();
                    withdrawSnapshot.forEach(doc => pendingWithdrawals.push({ id: doc.id, ...doc.data() }));
                } catch(e) { console.error(e); }
            }
            
            document.getElementById('content').innerHTML = `
                <div class="page-title">МОДЕРКА</div>
                <div class="page-subtitle">Панель администратора</div>
                <div style="background:linear-gradient(135deg, var(--gradient-start), var(--gradient-end)); border-radius:20px; padding:20px; margin-bottom:20px; color:white">
                    <div style="font-size:14px; opacity:0.9">💰 ОБЩИЙ ДОХОД МАРКЕТА</div>
                    <div style="font-size:36px; font-weight:bold; margin:10px 0">$${incomeStats.allTime.toFixed(2)}</div>
                </div>
                
                <div style="background:var(--card-bg); border-radius:20px; padding:20px; margin-bottom:20px; border:1px solid var(--border)">
                    <div style="font-weight:bold; margin-bottom:16px">💸 ЗАЯВКИ НА РУЧНОЙ ВЫВОД (${pendingWithdrawals.length})</div>
                    ${pendingWithdrawals.length === 0 ? '<div class="empty-state">Нет активных заявок</div>' : pendingWithdrawals.map(w => `
                        <div class="withdraw-request" style="border-left: 4px solid var(--warning); margin-bottom: 12px; padding: 12px; background: var(--input-bg); border-radius: 12px;">
                            <div>👤 Скупщик: @${escapeHtml(w.userName)} (ID: ${w.userId})</div>
                            <div>Сумма: $${w.amount} USDT (~${w.rubAmount} ₽)</div>
                            <div>Реквизиты: ${escapeHtml(w.targetTelegramId)}</div>
                            <div class="withdraw-request-actions">
                                <button class="btn btn-success" style="padding:6px; font-size:12px;" onclick="approveWithdrawal('${w.id}')">ВЫПЛАЧЕНО</button>
                                <button class="btn btn-danger" style="padding:6px; font-size:12px;" onclick="rejectWithdrawal('${w.id}')">ОТКЛОНИТЬ</button>
                            </div>
                        </div>
                    `).join('')}
                </div>

                <div style="background:var(--card-bg); border-radius:20px; padding:20px; margin-bottom:20px; border:1px solid var(--border)">
                    <div style="font-weight:bold; margin-bottom:16px">🆘 ОТКРЫТЫЕ ТИКЕТЫ ПОДДЕРЖКИ (${supportTickets.length})</div>
                    ${supportTickets.length === 0 ? '<div class="empty-state">Нет открытых обращений</div>' : supportTickets.map(t => `
                        <div class="withdraw-request" style="border-left: 4px solid var(--primary); padding:12px; background:var(--input-bg); border-radius:12px; margin-bottom:12px;">
                            <div style="font-weight:bold">От: @${escapeHtml(t.userName)} (ID: ${t.userId})</div>
                            <div style="margin:6px 0; font-size:13px; color:var(--text-secondary); white-space:pre-wrap;">${escapeHtml(t.text)}</div>
                            <div style="display:flex; gap:8px;">
                                <button class="btn btn-success" style="padding:6px; font-size:12px; flex:1;" onclick="openSupportTicketChat('${t.userId}', '${escapeHtml(t.userName)}')">💬 ОТВЕТИТЬ</button>
                                <button class="btn btn-danger" style="padding:6px; font-size:12px; flex:1;" onclick="closeSupportTicket('${t.id}')">❌ ЗАКРЫТЬ</button>
                            </div>
                        </div>
                    `).join('')}
                </div>

                <div style="background:var(--card-bg); border-radius:20px; padding:20px; margin-bottom:20px; border:1px solid var(--border)">
                    <div style="font-weight:bold; margin-bottom:16px">⚙️ УПРАВЛЕНИЕ ЦЕНАМИ ПРЕДМЕТОВ</div>
                    <div id="productsPriceList" style="max-height:250px; overflow-y:auto;"></div>
                </div>
                
                <div style="background:var(--card-bg); border-radius:20px; padding:20px; margin-bottom:20px; border:1px solid var(--border)">
                    <div style="font-weight:bold; margin-bottom:16px">👥 НАЗНАЧИТЬ СКУПЩИКА</div>
                    <div style="display:flex; gap:8px; margin-bottom:12px;">
                        <input type="text" id="newScupUsername" class="search-input" style="margin-bottom:0;" placeholder="@username">
                        <button class="btn btn-success" style="width:auto; padding:0 16px;" onclick="assignScup(document.getElementById('newScupUsername').value, false)">+ СКУП</button>
                        <button class="btn" style="width:auto; padding:0 16px; background:linear-gradient(135deg, #ff9800, #ff5722);" onclick="assignScup(document.getElementById('newScupUsername').value, true)">+ ДОВЕРЕННЫЙ</button>
                    </div>
                    <div style="font-weight:bold; margin-bottom:16px">👥 СПИСОК СКУПОВ</div>
                    <div id="scupsListContainer"></div>
                </div>
            `;
            
            const priceContainer = document.getElementById('productsPriceList');
            if (priceContainer) {
                priceContainer.innerHTML = allProducts.map(p => `
                    <div class="price-edit-row">
                        <div style="font-size:13px; flex:2">${p.name}</div>
                        <input type="number" id="price_${p.id}" value="${p.priceUsd}" step="0.0001">
                        <button class="btn" style="width:auto; padding:6px 12px; margin-left:8px;" onclick="updateProductPrice(${p.id})">💾</button>
                    </div>
                `).join('');
            }
            
            const scupsContainer = document.getElementById('scupsListContainer');
            if (scupsList.length === 0) {
                scupsContainer.innerHTML = '<div class="empty-state">Нет назначенных скупов</div>';
            } else {
                scupsContainer.innerHTML = scupsList.map(s => `
                    <div class="scup-item">
                        <div class="scup-info">
                            <span>👤 @${escapeHtml(s.username)}</span>
                            ${s.type === 'trusted' ? '<span class="scup-badge-verified">⭐️✅ ДОВЕРЕННЫЙ</span>' : '<span class="scup-badge">⭐️ СКУП</span>'}
                        </div>
                    </div>
                `).join('');
            }
        }
        
        async function assignScup(username, isTrusted) {
            if (!isAdmin || !db || !username.trim()) return;
            const cleanUsername = username.trim().replace('@', '');
            try {
                const usersSnapshot = await db.collection('users').where('username', '==', cleanUsername).get();
                if (usersSnapshot.empty) {
                    if (tg) tg.showAlert('❌ Пользователь не найден в базе данных бота');
                    return;
                }
                const userId = usersSnapshot.docs[0].id;
                await db.collection('users').doc(userId).update({
                    isScup: true,
                    isTrustedScup: isTrusted
                });
                if (tg) tg.showAlert(`✅ Пользователь @${cleanUsername} назначен скупщиком!`);
                document.getElementById('newScupUsername').value = '';
                // Перезапуск слушателей Firebase обновит списки
            } catch (e) {
                console.error(e);
            }
        }

        function closeModal() {
            const modals = document.querySelectorAll('.modal');
            modals.forEach(m => m.remove());
        }
        
        function switchTab(tabId) {
            currentTab = tabId;
            closeModal();
            
            const floatingBar = document.getElementById('floatingBar');
            if (floatingBar) floatingBar.classList.add('hidden');
            
            if (tabId === 'home') renderHome();
            else if (tabId === 'sell') renderSell();
            else if (tabId === 'mySales') renderMySales();
            else if (tabId === 'scupka') renderScupka();
            else if (tabId === 'myPurchases') renderMyPurchases();
            else if (tabId === 'profile') renderProfile();
            else if (tabId === 'finances') renderFinances();
            else if (tabId === 'support') renderSupport();
            else if (tabId === 'chats') renderChatList();
            else if (tabId === 'moderka') renderModerka();
            
            renderTabBar();
        }
        
        function renderTabBar() {
            const tabs = [
                { id: 'home', label: 'ГЛАВНАЯ', icon: '🏠' },
                { id: 'sell', label: 'ПРОДАТЬ', icon: '📦' },
                { id: 'mySales', label: 'МОИ ПРОДАЖИ', icon: '⏳' }
            ];
            
            if (isScup || isTrustedScup || isAdmin) {
                tabs.push({ id: 'scupka', label: 'СКУПКА', icon: '💰' });
                tabs.push({ id: 'myPurchases', label: 'ХОЛД', icon: '🛍️' });
            }
            if (isAdmin) {
                tabs.push({ id: 'moderka', label: 'МОДЕРКА', icon: '⚙️' });
            }
            
            document.getElementById('tabBar').innerHTML = tabs.map(t => `
                <button class="tab-btn ${currentTab === t.id ? 'active' : ''}" data-tab="${t.id}" onclick="switchTab('${t.id}')">
                    <span class="tab-icon">${t.icon}</span>
                    <span>${t.label}</span>
                </button>
            `).join('');
        }
        
        // ==================== INITIALIZATION ====================
        loadProductPrices();
        if (tg) {
            tg.ready();
            tg.expand();
            const tgUser = tg.initDataUnsafe?.user;
            if (tgUser) {
                currentUser = {
                    id: tgUser.id,
                    username: tgUser.username || `user_${tgUser.id}`,
                    first_name: tgUser.first_name
                };
                const av = document.getElementById('avatarBtn');
                if (av) av.textContent = (tgUser.username || tgUser.first_name || 'U').substring(0, 2).toUpperCase();
            } else {
                // Локальные тесты вне Telegram
                currentUser = { id: 12345, username: "local_test_user", first_name: "Test" };
            }
        } else {
            currentUser = { id: 12345, username: "local_test_user", first_name: "Test" };
        }
        
        // Настройка слушателей реального времени Firebase
        async function startFirebaseListeners() {
            if (!db) {
                renderHome();
                renderTabBar();
                return;
            }
            
            await loadUserData();
            renderHome();
            renderTabBar();
            
            // 1. Слушатель лотов на продажу
            db.collection('orders').orderBy('createdAt', 'desc').onSnapshot(snapshot => {
                sellOrders = [];
                snapshot.forEach(doc => {
                    sellOrders.push({ id: doc.id, ...doc.data() });
                });
                if (currentTab === 'mySales') renderMySales();
                if (currentTab === 'scupka') renderScupka();
            });
            
            // 2. Слушатель выкупленных лотов (холдов)
            if (currentUser) {
                db.collection('purchases')
                  .where('buyerId', '==', currentUser.id.toString())
                  .onSnapshot(snapshot => {
                      purchaseOrders = [];
                      snapshot.forEach(doc => {
                          purchaseOrders.push({ id: doc.id, ...doc.data() });
                      });
                      if (currentTab === 'myPurchases') renderMyPurchases();
                  });
                  
                // Подгрузка истории выплат самого пользователя
                db.collection('withdrawals')
                  .where('userId', '==', currentUser.id.toString())
                  .orderBy('createdAt', 'desc')
                  .onSnapshot(snapshot => {
                      withdrawals = [];
                      snapshot.forEach(doc => {
                          withdrawals.push({ id: doc.id, ...doc.data() });
                      });
                  });
            }
            
            // 3. Список скупщиков для админки
            db.collection('users').where('isScup', '==', true).onSnapshot(snapshot => {
                scupsList = [];
                snapshot.forEach(doc => {
                    scupsList.push({ id: doc.id, ...doc.data() });
                });
                if (currentTab === 'moderka') renderModerka();
            });
            
            // 4. Статистика админки
            db.collection('stats').doc('income').onSnapshot(doc => {
                if (doc.exists) {
                    incomeStats = { ...incomeStats, ...doc.data() };
                    if (currentTab === 'moderka') renderModerka();
                }
            });
        }
        
        startFirebaseListeners();
        
        // Нажатия верхнего меню пользователя
        document.getElementById('themeToggle')?.addEventListener('click', toggleTheme);
        document.getElementById('avatarBtn')?.addEventListener('click', () => {
            document.getElementById('userMenu')?.classList.toggle('hidden');
        });
        
        document.getElementById('profileBtn')?.addEventListener('click', () => { document.getElementById('userMenu')?.classList.add('hidden'); switchTab('profile'); });
        document.getElementById('financesBtn')?.addEventListener('click', () => { document.getElementById('userMenu')?.classList.add('hidden'); switchTab('finances'); });
        document.getElementById('supportBtn')?.addEventListener('click', () => { document.getElementById('userMenu')?.classList.add('hidden'); switchTab('support'); });
        document.getElementById('logoutBtn')?.addEventListener('click', () => { document.getElementById('userMenu')?.classList.add('hidden'); if(tg) tg.close(); });
        document.getElementById('chatBtn')?.addEventListener('click', () => { document.getElementById('userMenu')?.classList.add('hidden'); switchTab('chats'); });
        
        window.switchTab = switchTab;
        window.setMode = setMode;
        window.cancelSale = cancelSale;
        window.buyAsScup = buyAsScup;
        window.confirmDeposit = confirmDeposit;
        window.confirmWithdraw = confirmWithdraw;
        window.closeModal = closeModal;
        window.showDepositModal = showDepositModal;
        window.showWithdrawModal = showWithdrawModal;
        window.assignScup = assignScup;
        window.copyToClipboard = copyToClipboard;
        window.updateProductPrice = updateProductPrice;
        window.openChat = openChat;
        window.renderChatList = renderChatList;
        window.closeSupportTicket = closeSupportTicket;
        window.openSupportTicketChat = openSupportTicketChat;
        window.checkInvoiceStatus = checkInvoiceStatus;
        window.confirmEscrowPurchase = confirmEscrowPurchase;
        window.cancelEscrowPurchase = cancelEscrowPurchase;
        window.approveWithdrawal = approveWithdrawal;
        window.rejectWithdrawal = rejectWithdrawal;
        window.openSellQuantityModal = openSellQuantityModal;
        
        initTheme();
    </script>
</body>
</html>
